# mongodb-search-helm: MongoDB Search (mongot) behind the operator-managed Envoy, from one values file.
# It replaces Steps 6a, 6b and 6d of docs/mongot-envoy-mtls-fresh-install-runbook.md and adds the operator install.
#
# The chart never creates the hand-made objects of runbook Steps 1 to 5 (three TLS secrets, the sync password
# secret, the trust bundle) and never reads their contents; the preflight checks they exist.
#   helm install mongot chart/mongodb-search-helm -n <namespace> -f my-values.yaml --timeout 20m

# The namespace every object of the chart goes to. It must already exist and already hold the hand-made objects.
# Pass the same namespace to helm with -n, so Helm's record of the release sits beside what it installed.
# Empty: the namespace given to helm with -n.
namespace: ""

operator:
  # true: install the MongoDB operator here through OLM. false: an operator already serves this namespace (installed
  # here by other means, or cluster-wide); the chart then renders no Subscription, OperatorGroup, reclaim or approver.
  install: true
  # The operator version to install, and the ONLY version the approver approves. A newer version that OLM stages
  # waits for a human; to upgrade, change this and upgrade the release. Keep Chart.yaml's appVersion equal to it.
  version: "1.13.0"
  channel: stable
  # The package as the catalog names it: the Subscription's name and spec.name, and the prefix of every CSV name.
  package: mongodb-kubernetes
  source: certified-operators
  sourceNamespace: openshift-marketplace

operatorGroup:
  # OLM allows ONE OperatorGroup per namespace. true: the chart creates one that targets the release's namespace.
  # false: the namespace already has one that targets it (the preflight refuses a second). Ignored without
  # operator.install.
  create: true

# Approves the InstallPlan of operator.version only, after checking the plan installs exactly
# <package>.v<version> and nothing else.
installPlanApprover:
  waitSeconds: 300

# Clears a CSV that a previous uninstall left behind with no Subscription, the case that blocks a reinstall. It
# deletes only an unowned, unreferenced, settled CSV of this package, and only after OLM reports ResolutionFailed
# or, under Argo CD, where the hook runs before the Subscription is made, when the namespace holds no Subscription
# of this package.
csvReclaim:
  enabled: true
  waitSeconds: 120

# Checks, before anything is created, that the hand-made objects exist with the keys the operator reads:
# <prefix>-<name>-search-cert, <prefix>-<name>-search-lb-0-cert, <prefix>-<name>-search-lb-0-client-cert
# (tls.crt, tls.key), the password secret's key, and ca.crt in the trust bundle. It prints types and key names,
# never contents. A failed check keeps its Job: oc logs -n <namespace> job/<release>-...-preflight
preflight:
  enabled: true

# The MongoDBSearch resource (runbook Step 6a).
search:
  # metadata.name. The TLS secret names and the operator's object names derive from it:
  # <name>-search-0 (StatefulSet), <name>-search-lb-0 (Envoy), <name>-search-0-proxy-svc (Service). At most 43
  # characters (the StatefulSet's pod label controller-revision-hash), and 36 with Ops Manager on (the forwarder's
  # pod label app=<name>-search-metrics-forwarder-0): a label value holds 63. The schema refuses a longer name.
  name: mongot
  # mongot version, pinned to the operator's own default for operator.version 1.13.0, so that an operator upgrade
  # does not move mongot by itself: change it as a step of its own. Empty: spec.version is left out and the operator
  # runs its own default, so mongot moves whenever operator.version does. scripts/refresh-mongodbsearch-crd.sh prints
  # a new operator's default.
  version: "1.70.1"
  # The number of mongot pods. LOWERING IT DELETES VOLUMES: the operator sets the StatefulSet to delete the volume
  # claim of every pod that is scaled away, and every claim at 0. A pod that comes back builds every index again
  # from the collection: hours on a large deployment. An upgrade to fewer pods is refused by the preflight unless
  # allowVolumeLoss is true for that upgrade. Never scale the StatefulSet by hand. See volumes.md and scaling.md.
  replicas: 3
  allowVolumeLoss: false
  # CPU and memory of each mongot pod. A change restarts the pods one at a time, each on its volume. Without
  # -Xms or -Xmx in jvmFlags the operator sets the heap to half of the memory REQUEST (never the limit), at most
  # 30Gi (-Xmx30720m from a request of 60Gi or more; operator 1.13.0). The rest of the memory limit is the JVM's own
  # memory outside the heap and the file-system cache that holds the index. mongot sizes its thread pools to the
  # CPUs the JVM counts: the CPU LIMIT, rounded up (the request is never read), or every CPU of the node without one.
  resources:
    requests: {cpu: "1", memory: 3Gi}
    limits: {cpu: "3", memory: 5Gi}
  # mongot's own settings, written as they are under advancedConfigs in mongot's config file
  # (spec.clusters[0].advancedMongotConfigs; the operator neither reads nor changes them). Every value is optional:
  # a null in a map is left out, and mongot's default applies; with every value null nothing is rendered. mongot
  # logs "<name> not configured, defaulting to <n>." for three of the five counts below, never for
  # numIndexingThreads or numConcurrentSynonymSyncs. The top-level keys are mongot 1.70.1's (indexing, querying,
  # replication, autoEmbedding, cursor, searchQueryAdmissionControl, diskMonitor, ftdc), and so are the keys under
  # replication and replication.mongodb: the schema refuses any other there. Below the other top-level keys a
  # misspelled key reaches mongot, which starts anyway and only logs "Ignoring unrecognized field(s) in mongot
  # config file". A CHANGE RESTARTS EVERY MONGOT POD, one at a time (the operator hashes the config file into the
  # pods' mongotConfigHash), and interrupts every index being built (mongot resumes one from the progress it last
  # committed, when it committed any): change it when every index is STEADY.
  # The concurrency counts below are whole numbers of at least 1; "CPUs" is what the JVM counts, the CPU limit. The
  # one worth changing is numConcurrentInitialSyncs: more is a faster rebuild of many indexes, at the cost of more
  # CPU, memory, load on the source, and disk at once (each index being built is a second copy while the first is
  # kept). The disk watermarks (diskMonitor) are MongoDB's documented values, and the chart's alerts follow them.
  # Meanings, types, how each default follows the CPU limit, and how to change them: mongot-settings.md.
  advancedMongotConfigs:
    replication:
      mongodb:
        # How many indexes mongot builds at once. Default: the CPUs, at most 2.
        numConcurrentInitialSyncs:
        # Change streams that may have a getMore outstanding on the source at once. Default: 2 per CPU.
        numConcurrentChangeStreams:
        # Threads that write the indexes. Default: one per CPU.
        numIndexingThreads:
        # Threads that decode change-stream events. Default: half the CPUs, at least 1.
        numChangeStreamDecodingThreads:
        # Synonym collections synced at once. Default: 2.
        numConcurrentSynonymSyncs:
  # JVM flags of mongot (spec.clusters[0].jvmFlags), each a word of its own: ["-Xms16g", "-Xmx16g"]. With -Xms or
  # -Xmx here the operator sets no heap of its own. MongoDB: a heap "below about 30GB allows the JVM to use
  # compressed object pointers"; above it, 48GB or more. A change restarts the mongot pods one at a time. Empty: the
  # operator's heap, described above.
  jvmFlags: []
  persistence:
    # The size of each pod's volume. Raising it here does not grow a volume that exists: Kubernetes forbids a
    # change of a StatefulSet's volume claim template, the MongoDBSearch goes Failed (the pods keep running and
    # answering), and the upgrade's gate stops and says so. The volumes are then grown by hand:
    # volume-expansion-runbook.md, with expand-mongot-volumes.sh, both beside this file. It cannot be lowered: a
    # smaller size than the volumes were made at is not supported, and the preflight refuses it before anything is
    # changed.
    storage: 10Gi
    # Empty: the cluster's default storage class.
    storageClass: thin-csi
    # true: a Job of the chart takes those steps by hand itself, with the same script, between the MongoDBSearch
    # and the gate of a sync or an upgrade: a larger `storage` above is then all it takes. It acts when the
    # operator has refused the new size, or to finish a growth that stopped before its end (the resource Running,
    # its plan with something left), and on nothing else. It needs a storage class that can grow a volume
    # (allowVolumeExpansion), and its service account may then ask this namespace's claims for more, delete the
    # mongot StatefulSet, by name, and delete a mongot pod, by name: where a volume's file system grows only when
    # its pod is started again, that pod is deleted once the StatefulSet has been made again, keeps its claim and
    # comes back on it, one pod at a time. It may also run a command in a mongot pod, by name: df, to verify at the
    # end that the file system the pod sees is as large as its claim. The Job plans first (the sizes compared, and
    # what follows from them) and changes nothing when the plan finds nothing to do.
    # false: the gate stops and names the runbook, as before.
    autoExpand:
      enabled: false
      # How long one claim may take to reach the new size, and its pod to be Ready again, in seconds. Not under 180:
      # a claim that waits for its pod is watched for two minutes before it is left for the restart, and a wait
      # that ends before that stops the Job at that claim.
      claimWaitSeconds: 900
  # true: `helm uninstall` leaves the MongoDBSearch, its pods and its volumes in place (helm.sh/resource-policy:
  # keep) and removes the rest of the release, the Route included. Under Argo CD the resource is also kept when the
  # Application is deleted and when a sync would prune it (Delete=false, Prune=false). It does not stop
  # `oc delete mongodbsearch`: see volumes.md. false: an uninstall removes the resource, and every mongot volume
  # and its index go with it.
  keepOnUninstall: true
  # A PodDisruptionBudget for the mongot pods: a node drain may take down at most maxUnavailable of them at a
  # time, and waits for a pod to be Ready again before it takes the next. The operator creates none. It does not
  # hold back a rolling restart, a scale-down or a deleted pod: only evictions. See disruption-budgets.md.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

# The operator-managed Envoy in front of mongot.
loadBalancer:
  # REQUIRED. The public name mongod connects to. It is also the Route's host and must be a SAN of the
  # <prefix>-<name>-search-lb-0-cert certificate. A hostname, never an IP: Envoy selects by SNI.
  externalHostname: ""
  # Three, so that two stay through a node drain with the budget below: disruption-budgets.md, "Two Envoy pods, or
  # three". A third pod is a standby, not capacity: one mongod sends every search through one Envoy pod.
  replicas: 3
  retryPolicy:
    numRetries: 2
    perTryTimeout: 60s
  # CPU and memory of each Envoy pod. These are the operator's own defaults, written out. What is given here
  # replaces the operator's defaults whole: MongoDB, "If you specify this setting, the Kubernetes Operator replaces
  # the defaults entirely", so requests alone (limits: null in a values file) run Envoy without limits. Helm
  # merges what a values file gives with these four numbers key by key: leaving limits out keeps them, limits: null
  # removes them. null for the whole block: the field is left out and the operator's defaults apply. A change
  # restarts the Envoy pods one at a time.
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # Envoy image override, as a full reference (name:tag or name@digest). The default is a copy on quay.io of the
  # operator's own envoyproxy/envoy:v1.37-latest, for clusters that cannot pull from Docker Hub; the copy is not
  # refreshed when Docker Hub moves that tag. Empty: the operator's own Envoy image.
  image: quay.io/ephico2real/envoy:v1.37-latest
  # The same for the Envoy pods. With three Envoy pods and 1 here, two always stay to carry the searches.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

tls:
  # The operator finds the three TLS secrets by name: <prefix>-<search.name>-search-cert and the two
  # <prefix>-<search.name>-search-lb-0-(client-)cert. A wrong prefix is not an error to the operator.
  certsSecretPrefix: ent
  # ConfigMap with key ca.crt: what mongot and Envoy trust, and what mongot verifies the source mongod with.
  trustBundleConfigMap: ent-trust-bundle

# The external replica set mongot syncs from.
source:
  # REQUIRED. One "host:port" per member, so mongot keeps syncing when one member is down.
  hostAndPorts: []
  username: mongotuser
  passwordSecret:
    name: search-sync-source-password
    # Empty: passwordSecretRef.key is left out and the operator uses its default.
    key: password
  # Which members of the replica set mongot syncs from, by the tags in the replica set's configuration
  # (rs.conf(), members[].tags). An ordered list of tag sets: mongot reads from a secondary that matches the first
  # set with a match, and a last {} matches any member. A tag that no member carries is not an error to the
  # chart. Rendered as spec.clusters[0].syncSourceSelector.matchTagSets; the operator writes it into mongot's
  # syncSource.replicationReader.tagSets (operator 1.13.0). Empty: left out, and mongot reads from any member.
  # For example:
  #   matchTagSets:
  #     - region: us-east-1
  #       workload: search
  #     - {}
  syncSourceSelector:
    matchTagSets: []

observability:
  prometheus:
    mode: enabled
    port: 9946
  metricsForwarder:
    mode: auto
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}
    # The forwarder's image override, as a full reference (name:tag or name@digest). Rendered as the container
    # metrics-forwarder under spec.observability.metricsForwarder.deployment, which the operator merges into its
    # Deployment by container name, as for Envoy. The default is operator 1.13.0's own image,
    # otel/opentelemetry-collector-contrib:0.152.0, copied from Docker Hub with all its architectures and the same
    # digest, for clusters that cannot pull from Docker Hub. Empty: the operator's own image.
    image: quay.io/ephico2real/opentelemetry-collector-contrib:0.152.0
    # Ops Manager, for the metrics forwarder: a Deployment of the operator's that sends mongot's metrics to an Ops
    # Manager project. With an external source the operator runs it only when this is set (mode auto). Ops Manager
    # 8.0.25 or later (operator 1.13.0). Rendered as spec.observability.metricsForwarder.opsManager.
    # The ConfigMap and the Secret are kept by an uninstall and an Argo CD prune or delete: the operator reads both
    # while it deletes the MongoDBSearch, and without them the resource would stay stuck in deletion. Delete them
    # by hand once the search is gone.
    opsManager:
      # false: no opsManager block, no ConfigMap, no Secret and no forwarder; mongot's metrics still reach
      # Prometheus, the dashboard and the alerts. Nothing else below is read.
      enabled: false
      # The project ConfigMap (projectConfigMapRef).
      projectConfig:
        name: om-project-config
        # true: the chart makes it from the values below. false: it exists already, with baseUrl and orgId.
        create: true
        # REQUIRED when created. Ops Manager's URL, http(s) with no query string: https://opsmanager.example.com
        baseUrl: ""
        # REQUIRED when created. The organization's id.
        orgId: ""
        projectName: ""
        # The name of a ConfigMap holding Ops Manager's CA under the key mms-ca.crt, for an Ops Manager whose
        # certificate the company CA signed (MongoDB: "Required only when using custom TLS certificates"). Empty:
        # left out.
        sslMMSCAConfigMap: ""
        # Whether the operator and the forwarder check Ops Manager's certificate, written as "true" or "false".
        # false by the owner's decision: Ops Manager is an internal service, signed by the company CA, and trusted.
        # true checks it, and then needs sslMMSCAConfigMap. null leaves the key out (the operator then checks).
        sslRequireValidMMSServerCertificates: false
      # The Secret with the agent API key, under the key agentApiKey (agentCredentials).
      agentCredentials:
        name: om-agent-api-key
        # The agent API key. Set: the chart makes the Secret from it (the key is then in this values file and in
        # Helm's release record: keep the values in a repository only the operations team can read). Empty: the
        # Secret exists already, made by hand or by another tool.
        agentApiKey: ""

# The passthrough Route to Envoy (runbook Step 6d). Its host is loadBalancer.externalHostname and its termination
# is passthrough: Envoy presents the certificate, not the router.
route:
  enabled: true
  name: mongot-search
  # Empty: the Service the operator creates for Envoy, <search.name>-search-0-proxy-svc.
  serviceName: ""
  # A port name on that Service, or a number.
  targetPort: mongot-grpc
  # How the router places each new connection on an Envoy pod. A passthrough Route defaults to source, which
  # sent every connection to one Envoy pod in the lab; see docs/mongot-route-balance-rationale.md.
  balance: roundrobin
  annotations: {}
  labels: {}

# Needs user workload monitoring on the cluster; without it the objects are created and nothing scrapes them.
monitoring:
  serviceMonitors:
    # Scrapes each mongot pod (port prometheus) and each Envoy pod (admin port 9901, /stats/prometheus) through
    # a ClusterIP Service the chart adds for Envoy's admin port. On by default.
    enabled: true
    interval: 15s
    labels: {}
  alerts:
    # A PrometheusRule with recording rules and twelve alerts: four on traffic (the first fires when one mongot
    # pod serves over 90% of search traffic), five on the indexes, and the volume alert at three levels. On by
    # default.
    enabled: true
    labels: {}
    runbookUrl: https://github.com/ephico2real2/mongodb-poc/blob/main/README.md#the-failure-that-produces-no-error
    # MongotDataPathFillingUp: three levels, as the used share (per cent) of the file system under mongot's data
    # path, per pod. A pod is in one level at a time, from that level's value up to the next one's.
    #   info      70: MongoDB, "below 30% free, consider having a planning conversation to increase storage".
    #   warning   80: MongoDB, "less than 20% free on the mongot dataPath volume can cause availability issues".
    #   critical  90: above it mongot stops following the source (and builds no index above 85, exits at 95).
    # To change one: --set monitoring.alerts.dataPathUsed.info=75. Whole numbers, and they must rise. null leaves a level out
    # (--set monitoring.alerts.dataPathUsed.info=null), and the level below it then runs up to the next one; all
    # three null leaves the alert out.
    dataPathUsed:
      info: 70
      warning: 80
      critical: 90
  # The "MongoDB Search" dashboard in the OpenShift console (Observe -> Dashboards (Perses)): a PersesDashboard
  # and the PersesDatasource it queries, in this namespace. Needs the Cluster Observability Operator (COO 1.5 or
  # later) on the cluster, and the ServiceMonitors above for data. On by default: set it to false on a cluster
  # without COO, where its kinds do not exist and the install would fail. Viewers need view in this namespace
  # and cluster-monitoring-view.
  persesDashboard:
    enabled: true
    # Thanos Querier's cluster-wide port. The per-namespace port (9092) refuses the Perses UI's POST queries
    # for readers.
    thanosURL: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
  # The same dashboard for Grafana: a ConfigMap labelled grafana_dashboard: "1", which a Grafana dashboard
  # sidecar loads. Without such a Grafana the ConfigMap is simply unused. Off by default.
  grafanaDashboard: false
  # The names of the search indexes, as metrics: mongot's own metrics name an index by its id only. A small
  # Deployment asks the source deployment for its search indexes when Prometheus scrapes it and serves
  # mongodb_search_index_info{indexId_logString, database, collection, index_name, stored_source}. Off by default:
  # it needs a database user of its own on the source, and that user's password in a Secret made by hand.
  # The user needs listDatabases on the cluster, and listCollections and listSearchIndexes on every database; give
  # it no right to read a document. Do not use the sync user (source.username).
  indexInfo:
    enabled: false
    # The stock MongoDB Community Server image: it has python3 and mongosh, and nothing is built for this. By digest
    # (the index: each platform takes its own image), so that the tag cannot be moved under it. Where outside
    # registries are closed, mirror it and name the mirror here.
    image: quay.io/mongodb/mongodb-community-server:8.3.4-ubi9@sha256:fc8c72e07934aecdff8ac7053c1c7ee8bf1f6a6b594618f2aff8e024006fb569
    username: search-index-info
    passwordSecret:
      name: search-index-info-password
      key: password
    # Added to the connection string, for example "replicaSet=rs0". TLS, the CA and the hosts come from the values
    # the MongoDBSearch uses: source.hostAndPorts and tls.trustBundleConfigMap.
    uriOptions: ""
    # How long an answer of the source is served before it is asked again, and how often Prometheus scrapes.
    # The interval is at least 25s, the scrape timeout: Prometheus refuses a timeout longer than its interval.
    cacheSeconds: 60
    interval: 60s
    # A CPU limit as well, for a namespace whose ResourceQuota requires one.
    resources:
      requests: {cpu: 10m, memory: 96Mi}
      limits: {cpu: 500m, memory: 384Mi}

# The post-install gate: returns when the operator's CSV is Succeeded, the MongoDBSearch has observed its current
# generation and is Running, mongot and Envoy are rolled out to the requested replicas, Envoy mounts the expected
# certificates, and the Route is admitted; otherwise it fails and says which.
# Helm waits for hooks only up to its --timeout (default 5m): pass --timeout 20m.
wait:
  waitSeconds: 900
  intervalSeconds: 10

# The image of the Jobs (preflight, reclaim, approver, gate): a shell and oc.
jobs:
  image:
    repository: registry.redhat.io/openshift4/ose-cli
    tag: latest
  # Every request and limit is set: a namespace whose ResourceQuota covers requests or limits refuses a pod that
  # leaves one out ("failed quota: ... must specify limits.cpu"), and the Job then fails at its deadline.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1024Mi}
  ttlSecondsAfterFinished: 600
