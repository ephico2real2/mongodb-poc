{{- /*
Clears a CSV left by an earlier uninstall, so a reinstall is one shot. `helm uninstall` removes the Subscription
and OLM leaves the CSV (and so the operator) in place; a new Subscription then cannot resolve against it.

The script is the openshift-coo chart's csv-reclaim (itself the openshift-grafana chart's), with one addition. It
deletes only a CSV of this package that is not an OLM copy, has no owner, is referenced by no Subscription and is
settled (Succeeded/Failed), and only on one of two verdicts: OLM reports ResolutionFailed on the Subscription, or
the namespace holds no Subscription of this package at all. A clean install pays one list and exits.
Measured for other operators on CRC; for mongodb-kubernetes see the chart README, "Tested" and "Argo CD".

Helm weight -2, ahead of the approver: the Subscription is there by then, and the first verdict decides. Argo CD
wave -3, ahead of the OperatorGroup (-2) and the Subscription (-1): there the second verdict decides, before a
Subscription exists. Argo CD fails a sync on a Subscription that reads ResolutionFailed, so under Argo CD the CSV
must be gone before the Subscription is made (issue #101). Rendered only with the Subscription.
*/ -}}
{{- if and .Values.operator.install .Values.csvReclaim.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mongodb-search-helm.fullname" . }}-csv-reclaim
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ add .Values.csvReclaim.waitSeconds 120 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "mongodb-search-helm.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mongodb-search-helm.fullname" . }}-csv-reclaim
      {{- include "mongodb-search-helm.jobPod" . | nindent 6 }}
      volumes:
        - name: work
          emptyDir:
            medium: Memory
      containers:
        - name: reclaim
          image: "{{ .Values.jobs.image.repository }}:{{ .Values.jobs.image.tag }}"
          resources:
            {{- toYaml .Values.jobs.resources | nindent 12 }}
          # The helper's context plus a read-only root, as in the original: the script writes only to /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/bash", "-c"]
          volumeMounts:
            - name: work
              mountPath: /tmp
          env:
            - name: KUBECACHEDIR
              value: /tmp/.kube/cache
            - name: NAMESPACE
              value: {{ include "mongodb-search-helm.namespace" . | quote }}
            - name: SUBSCRIPTION
              value: {{ .Values.operator.package | quote }}
            - name: PACKAGE
              value: {{ .Values.operator.package | quote }}
            - name: WAIT_SECONDS
              value: {{ .Values.csvReclaim.waitSeconds | quote }}
          args:
            - |
              set -uo pipefail
              : "${NAMESPACE:?}" "${SUBSCRIPTION:?}" "${WAIT_SECONDS:?}"

              log()  { printf '[csv-reclaim %s] %s\n' "$(date -u +%H:%M:%S)" "$*"; }
              fail() { printf '[csv-reclaim] FAILED: %s\n' "$*" >&2; exit 1; }

              SUBS=subscriptions.operators.coreos.com
              CSVS=clusterserviceversions.operators.coreos.com

              log "namespace=${NAMESPACE} subscription=${SUBSCRIPTION} budget=${WAIT_SECONDS}s"

              # CHEAP CHECK FIRST: IS THERE ANYTHING THAT COULD EVER BE RECLAIMED?
              # Measured on a clean install: this Job burned its entire 120s budget waiting for a verdict
              # that cannot arrive until the approver acts — and the approver runs AFTER it, by design. So
              # every clean install paid two minutes of dead time for a check that had nothing to check.
              #
              # An orphan is a CSV in this namespace that is not an OLM copy, has no ownerReferences and is
              # referenced by no Subscription. If none exists, there is nothing to reclaim whatever OLM
              # later decides, and waiting for a verdict cannot change that. Costs one list.
              CANDIDATE=""
              for c in $(oc get "$CSVS" -n "$NAMESPACE" -o name 2>/dev/null || true); do
                [ -n "$c" ] || continue
                nm="${c##*/}"
                [ -n "$nm" ] || continue
                # ANCHORED ON "<package>.v", never a substring. The ported form matched *<package>* and
                # measured (fake-oc harness): a CSV named <package>-community.v9.9.9 was reported
                # as an orphan of THIS package and deleted. A CSV name is <package>.v<version>, so the anchor
                # is exact; the approver in this chart anchors the same way for the same reason.
                case "$nm" in "${PACKAGE}.v"*) ;; *) continue ;; esac
                [ -n "$(oc get "$c" -n "$NAMESPACE" -o jsonpath='{.metadata.labels.olm\.copiedFrom}' 2>/dev/null || true)" ] && continue
                [ -n "$(oc get "$c" -n "$NAMESPACE" -o jsonpath='{.metadata.ownerReferences}' 2>/dev/null || true)" ] && continue
                # A CSV OLM IS ACTIVELY WORKING ON IS NOT AN ORPHAN. Measured: an upgrade left the CSV at
                # phase=Installing with no ownerReferences yet and no Subscription referencing it — so it
                # matched every orphan test, this Job waited its whole budget for a verdict that OLM had not
                # published yet, and the hook failed with DeadlineExceeded. Deleting it would have been worse:
                # it would have torn out an install in progress.
                #
                # Only a SETTLED CSV can be an orphan. Succeeded or Failed means OLM has finished with it;
                # Installing, Pending, Replacing and InstallReady all mean it is mid-flight.
                ref=""
                for s in $(oc get "$SUBS" -n "$NAMESPACE" -o name 2>/dev/null || true); do
                  [ "$(oc get "$s" -n "$NAMESPACE" -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)" = "$nm" ] && ref=yes
                done
                [ -n "$ref" ] && continue
                # MID-FLIGHT IS A REASON TO WAIT, NOT TO DISMISS. The sibling charts' scan skipped any CSV
                # that was not Succeeded or Failed, and measured here that is exactly the window a
                # reinstall lands in: 5 s after `helm uninstall` the orphan read InstallReady/
                # ComponentUnhealthy -> Installing (OLM re-creating a component the release had removed)
                # and was Succeeded again 12 s later. Dismissing it as "not an orphan" made this Job exit
                # at once, and the approver then failed on the ResolutionFailed the orphan causes. So an
                # unowned, unreferenced, non-copy CSV is a candidate whatever its phase; the settled test
                # is applied again, with the budget, where the deletion is decided.
                ph="$(oc get "$c" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                case "$ph" in
                  Succeeded|Failed) ;;
                  *) log "  ${nm}: phase=${ph:-<none>}, OLM is still working on it — a candidate, will wait for it to settle" ;;
                esac
                CANDIDATE="$nm"; break
              done
              if [ -z "$CANDIDATE" ]; then
                log "no unowned, unreferenced, non-copy CSV in ${NAMESPACE} — nothing could be orphaned, not waiting"
                exit 0
              fi
              log "possible orphan present (${CANDIDATE}); confirming with OLM before deleting anything"

              # WAIT FOR OLM TO PUBLISH A VERDICT BEFORE DECIDING. Straight after a sync neither condition
              # is set, so sampling once would see nothing and skip the reclaim — which is how the sibling
              # chart silently became dependent on a CronJob happening to fire. Poll until OLM either
              # reports an installed CSV (healthy, nothing to do) or ResolutionFailed (act).
              DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))
              VERDICT=""
              # NO SUBSCRIPTION OF THIS PACKAGE IS A VERDICT TOO, AND IT NEEDS NO WAITING. OLM refuses to resolve
              # a new Subscription while a CSV of its package sits in the namespace unreferenced: that refusal
              # is the ResolutionFailed below. With no Subscription there is nobody to report it yet, and the
              # candidate found above is in the way of the one this chart is about to make. Under Helm this
              # hook runs after the Subscription exists, so this branch is Argo CD's (wave -3). Measured on
              # CRC with Argo CD 3.5.3: waiting for ResolutionFailed there failed the whole sync, because Argo
              # CD reads that condition as a Degraded Subscription.
              #
              # ONLY ON A LIST THAT SUCCEEDED. A failed list is not "no Subscription"; neither is a
              # Subscription under another name whose package is this one, or one whose package cannot be read.
              if subs="$(oc get "$SUBS" -n "$NAMESPACE" -o name 2>/dev/null)"; then
                VERDICT=no-subscription
                for s in $subs; do
                  [ "${s##*/}" = "$SUBSCRIPTION" ] && VERDICT=""
                  pkg="$(oc get "$s" -n "$NAMESPACE" -o jsonpath='{.spec.name}' 2>/dev/null)" || pkg="$PACKAGE"
                  [ "$pkg" = "$PACKAGE" ] && VERDICT=""
                done
              fi
              while [ -z "$VERDICT" ] && [ "$(date +%s)" -lt "$DEADLINE" ]; do
                if [ -n "$(oc get "$SUBS" "$SUBSCRIPTION" -n "$NAMESPACE" -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)" ]; then
                  VERDICT=installed; break
                fi
                if [ "$(oc get "$SUBS" "$SUBSCRIPTION" -n "$NAMESPACE" -o jsonpath='{range .status.conditions[?(@.type=="ResolutionFailed")]}{.status}{end}' 2>/dev/null || true)" = "True" ]; then
                  VERDICT=resolution-failed; break
                fi
                log "waiting for OLM to report installedCSV or ResolutionFailed ..."
                sleep 5
              done

              if [ "$VERDICT" = "installed" ]; then
                log "OLM reports an installed CSV — nothing orphaned, nothing to do"
                exit 0
              fi
              if [ "$VERDICT" != "resolution-failed" ] && [ "$VERDICT" != "no-subscription" ]; then
                # No verdict either way inside the budget. Deleting a CSV on no evidence is the one thing
                # this Job must never do, so it exits 0 and leaves the decision to the approver, which will
                # report its own timeout with the InstallPlan state.
                log "OLM published no verdict within ${WAIT_SECONDS}s; taking no action"
                exit 0
              fi

              if [ "$VERDICT" = "no-subscription" ]; then
                WHY="no Subscription of ${PACKAGE}"
                log "no Subscription of ${PACKAGE} in ${NAMESPACE} — looking for an orphaned CSV to clear before one is made"
              else
                WHY="ResolutionFailed"
                log "Subscription reports ResolutionFailed — looking for an orphaned CSV to clear"
              fi
              # SIX CONDITIONS, ALL REQUIRED, because this deletes something the chart does not own.
              # Condition 1 (ResolutionFailed, or no Subscription of this package) is already established above.
              RECLAIMED=""
              UNSETTLED=""
              for c in $(oc get "$CSVS" -n "$NAMESPACE" -o name 2>/dev/null || true); do
                [ -n "$c" ] || continue
                name="${c##*/}"
                # 3. the name must match this package — anchored on <package>.v, as in the candidate scan
                case "$name" in "${PACKAGE}.v"*) ;; *) continue ;; esac
                # 6. NOT an OLM copy. AllNamespaces mode copies the CSV into EVERY namespace, and every
                #    copy looks unowned and unreferenced. Deleting a copy fights OLM, which recreates it.
                #    Only the source has an empty olm.copiedFrom, and only the source blocks resolution.
                copied="$(oc get "$c" -n "$NAMESPACE" -o jsonpath='{.metadata.labels.olm\.copiedFrom}' 2>/dev/null || true)"
                [ -n "$copied" ] && { log "  ${name}: OLM copy of ${copied}, leaving alone"; continue; }
                # 4. no ownerReferences — an OLM-managed CSV has an owner, an orphan does not
                owners="$(oc get "$c" -n "$NAMESPACE" -o jsonpath='{.metadata.ownerReferences}' 2>/dev/null || true)"
                [ -n "$owners" ] && { log "  ${name}: has ownerReferences, OLM-managed, leaving alone"; continue; }
                # SETTLED ONLY, but waited for: deleting a CSV mid-install tears out work in progress, and a
                # transient Installing (measured: 12 s after an uninstall) is not a reason to give up. Poll
                # the phase inside the remaining budget; only a CSV still unsettled at the deadline is left.
                phase="$(oc get "$c" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                while :; do
                  case "$phase" in Succeeded|Failed) break ;; esac
                  if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                    log "  ${name}: phase=${phase:-<none>} and still not settled at the deadline, leaving alone"
                    UNSETTLED="${UNSETTLED} ${name}"
                    continue 2
                  fi
                  log "  ${name}: phase=${phase:-<none>}, waiting for OLM to settle it before deciding ..."
                  sleep 5
                  phase="$(oc get "$c" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                done
                # 5. no Subscription reports it as installedCSV
                referenced=""
                for s in $(oc get "$SUBS" -n "$NAMESPACE" -o name 2>/dev/null || true); do
                  [ "$(oc get "$s" -n "$NAMESPACE" -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)" = "$name" ] && referenced=yes
                done
                [ -n "$referenced" ] && { log "  ${name}: referenced by a Subscription, leaving alone"; continue; }
                log "  ${name}: ORPHANED (no owner, unreferenced, not a copy) — deleting so OLM can resolve"
                # DELETE BY THE FULL `-o name` REFERENCE, and guard the name. The failure that made this
                # necessary: an upgrade logged only
                #   error: You must provide one or more resources by argument or filename
                # which is `oc delete`'s message for a call with NO resource — reached when $name was empty.
                # `$c` already carries `<type>/<name>` from the list, so using it directly removes the
                # reassembly step where a name can go missing at all.
                #
                # AND NOT THROUGH A PIPE. The old form was `oc delete ... 2>&1 | sed | fail`, where `||`
                # tests SED's exit status, not oc's — so a failed delete could be reported as a success. That
                # is the same subshell/exit-status trap the sibling sweeper hit with `printf | while read`.
                [ -n "$name" ] || fail "internal error: empty CSV name from '${c}' — refusing to run oc delete with no resource"
                # --wait=false, deliberately. The point is to unblock resolution, and OLM re-resolves once the deletion
                # is requested; a CSV carries an operators.coreos.com/csv-cleanup finalizer, so waiting adds a
                # way for this Job to hit its deadline without adding anything.
                if out="$(oc delete "$c" -n "$NAMESPACE" --wait=false 2>&1)"; then
                  printf '%s\n' "$out" | sed 's/^/    /'
                else
                  printf '%s\n' "$out" | sed 's/^/    /'
                  fail "could not delete orphaned CSV ${name}: ${out}
                A Forbidden means this ServiceAccount lacks delete on clusterserviceversions in ${NAMESPACE}."
                fi
                RECLAIMED="${RECLAIMED} ${name}"
                # WITH NO SUBSCRIPTION YET, WAIT FOR IT TO BE GONE. The Subscription is made next, and a CSV
                # that is still being finalized would be in its way exactly as before. Not on the
                # ResolutionFailed path: there OLM re-resolves by itself (see --wait=false above). Only
                # NotFound is "gone"; anything else is asked again, and an end of the budget is a failure
                # that names the CSV, which beats a Subscription failing later without saying why.
                if [ "$VERDICT" = "no-subscription" ]; then
                  GONE_BY=$(( $(date +%s) + 30 )); [ "$DEADLINE" -gt "$GONE_BY" ] && GONE_BY="$DEADLINE"
                  while :; do
                    if err="$(oc get "$c" -n "$NAMESPACE" -o name 2>&1 >/dev/null)"; then err="it is still there"
                    else case "$err" in *NotFound*|*"not found"*) log "  ${name}: gone"; break ;; esac; fi
                    [ "$(date +%s)" -ge "$GONE_BY" ] && fail "deleted ${name}, and it was not gone when the wait ended: ${err}
                A CSV carries the finalizer operators.coreos.com/csv-cleanup: oc get ${c} -n ${NAMESPACE} -o yaml"
                    log "  ${name}: deleted, waiting for it to be gone ..."
                    sleep 5
                  done
                fi
              done

              if [ -n "$RECLAIMED" ] && [ "$VERDICT" = "no-subscription" ] && [ -n "$UNSETTLED" ]; then
                # The settled candidates are gone, but one of this package never settled and is still here: it
                # blocks the Subscription exactly as the deleted ones would have, so do not say nothing is left.
                log "reclaimed:${RECLAIMED} — but a candidate CSV (${UNSETTLED# }) never settled within ${WAIT_SECONDS}s and is still in the way of the Subscription"
                log "inspect: oc get ${CSVS} -n ${NAMESPACE}; if it stays unsettled, OLM is stuck on it, not on this chart"
              elif [ -n "$RECLAIMED" ] && [ "$VERDICT" = "no-subscription" ]; then
                log "reclaimed:${RECLAIMED} — nothing of ${PACKAGE} is left in the way of the Subscription"
              elif [ -n "$RECLAIMED" ]; then
                log "reclaimed:${RECLAIMED} — OLM will re-resolve the Subscription on its own"
              elif [ -n "$UNSETTLED" ]; then
                # A candidate was found but never settled inside the budget. That is the orphan case with
                # OLM still working, not "no orphan": say which, so the approver's later timeout is read
                # against the right cause. Measured: the old message called a stuck-Installing orphan
                # "not the orphan case".
                log "${WHY} and a candidate CSV (${UNSETTLED# }) never settled within ${WAIT_SECONDS}s — left alone, nothing deleted"
                log "inspect: oc get ${CSVS} -n ${NAMESPACE}; if it stays unsettled, OLM is stuck on it, not on this chart"
              elif [ "$VERDICT" = "no-subscription" ]; then
                # The candidate of the scan above turned out to be a copy, owned or referenced by now.
                log "no Subscription of ${PACKAGE}, and no CSV here is orphaned — nothing deleted"
              else
                # ResolutionFailed with nothing reclaimable is a real problem this Job cannot fix, and
                # saying so beats letting the approver time out with a less specific message.
                log "ResolutionFailed, but no CSV here is orphaned — this is not the orphan case"
                oc get "$SUBS" "$SUBSCRIPTION" -n "$NAMESPACE" \
                  -o jsonpath='{range .status.conditions[?(@.type=="ResolutionFailed")]}{.message}{end}' 2>/dev/null | sed 's/^/    /'
                echo
                log "inspect: oc get ${CSVS} -n ${NAMESPACE}; oc get ${SUBS} ${SUBSCRIPTION} -n ${NAMESPACE} -o yaml"
              fi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mongodb-search-helm.fullname" . }}-csv-reclaim
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mongodb-search-helm.fullname" . }}-csv-reclaim
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  # The Subscription's ResolutionFailed condition and installedCSV.
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions"]
    verbs: ["get", "list"]
  # delete is the point, in this namespace only: the CSV that blocks resolution is always there.
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mongodb-search-helm.fullname" . }}-csv-reclaim
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mongodb-search-helm.fullname" . }}-csv-reclaim
subjects:
  - kind: ServiceAccount
    name: {{ include "mongodb-search-helm.fullname" . }}-csv-reclaim
    namespace: {{ include "mongodb-search-helm.namespace" . }}
{{- end }}
