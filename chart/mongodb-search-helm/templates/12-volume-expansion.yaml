{{- /*
Growing mongot's volumes from the values alone (search.persistence.autoExpand.enabled; off unless asked for).

A larger search.persistence.storage cannot reach a StatefulSet that exists: Kubernetes forbids a change of its
volume claim template, and the operator leaves the MongoDBSearch Failed. Without this Job the gate stops there and
names volume-expansion-runbook.md. With it, a Job between the MongoDBSearch and the gate takes the runbook's steps by
hand, with the runbook's own script, expand-mongot-volumes.sh, mounted from the chart: the claims are grown one pod
at a time, the StatefulSet is then deleted with --cascade=orphan for the operator to make again, and last, where a
volume's file system grows only when its pod is started again, that pod is restarted, one at a time.

It begins with a plan: the script compares what the resource asks for, what the StatefulSet's volumes were made at,
and what each claim asks for and has, and says what is to be done, if anything. Nothing to do (a first install, a
sync that changes no size, volumes that have their size) ends there. Something to do is done in two states only:
the operator has refused the new size (the resource Failed, with Kubernetes' sentence, the two sizes different), or
the resource is Running and what is left is the end of a growth. It ends by verifying that the growth has taken
effect, down to the file system each pod sees. Argo CD and Helm run a hook on every sync and upgrade: run a second
time, its plan finds nothing to do.
*/ -}}
{{- if .Values.search.persistence.autoExpand.enabled }}
{{- /* Kubernetes labels a Job's pods with the Job's name, and a label value holds at most 63 characters: the full name
(up to 50) is cut to 48 to leave room for the suffix. A full name of 48 or fewer keeps the name it always had. */}}
{{- $name := printf "%s-expand-volumes" (include "mongodb-search-helm.fullname" . | trunc 48 | trimSuffix "-") }}
{{- $claimWait := int .Values.search.persistence.autoExpand.claimWaitSeconds }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # The size this release asks for. Argo CD starts a sync only when an object it tracks differs, and a hook Job is
    # not one: with the size synced first and the flag set after, these four objects are what differs. Where they
    # were left by an earlier growth (an Application that does not prune), they would be as git has them, and
    # nothing would start; the size written here is what then differs. (Seen on the lab.)
    mongodb-search-helm/grows-to: {{ .Values.search.persistence.storage | quote }}
data:
  expand-mongot-volumes.sh: |
    {{- .Files.Get "expand-mongot-volumes.sh" | trimSuffix "\n" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# In this namespace only. It reads the one MongoDBSearch and the one StatefulSet by name, as the preflight does, and
# the pods and claims. It may ask a volume claim for more (a claim cannot be made smaller, and nothing else of a
# claim can be changed), and delete the mongot StatefulSet, by name. It may delete a mongot pod, by name, and no other
# pod: where a volume's file system grows only when its pod is started again, the script deletes that one pod, after
# the StatefulSet has been made again; the pod keeps its claim and comes back on it. It may not delete a claim.
# It may run a command in a mongot pod, by name: df, to compare the file system the pod sees with its claim. (A right
# to run a command in a pod is a right to do there what mongot's user can: read its secrets, write to its indexes.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: ["mongodb.com"]
    resources: ["mongodbsearch"]
    resourceNames: [{{ .Values.search.name | quote }}]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ include "mongodb-search-helm.mongotStatefulSet" . | quote }}]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- /* Never without names: a rule with an empty resourceNames is a rule for every pod. */}}
  {{- if gt (int .Values.search.replicas) 0 }}
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames:
      {{- range $i := until (int .Values.search.replicas) }}
      - {{ printf "%s-%d" (include "mongodb-search-helm.mongotStatefulSet" $) $i | quote }}
      {{- end }}
    verbs: ["delete"]
  # kubectl asks for create (SPDY) or get (WebSocket), by version.
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames:
      {{- range $i := until (int .Values.search.replicas) }}
      - {{ printf "%s-%d" (include "mongodb-search-helm.mongotStatefulSet" $) $i | quote }}
      {{- end }}
    verbs: ["create", "get"]
  {{- end }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "mongodb-search-helm.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    # After the MongoDBSearch (wave 1), before the gate (wave 3).
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  # The operator's reconcile; for each pod its claim and its readiness (--expand waits for both, each up to the claim
  # wait); the StatefulSet made again; then, for each pod that has to be restarted, the two minutes its claim is
  # watched first, its claim and its readiness.
  activeDeadlineSeconds: {{ add .Values.wait.waitSeconds (mul 4 $claimWait (int .Values.search.replicas)) (mul 120 (int .Values.search.replicas)) $claimWait 120 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "mongodb-search-helm.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "mongodb-search-helm.jobPod" . | nindent 6 }}
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
      containers:
        - name: expand
          {{- include "mongodb-search-helm.jobContainer" . | nindent 10 }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          env:
            - name: NAMESPACE
              value: {{ include "mongodb-search-helm.namespace" . | quote }}
            - name: SEARCH
              value: {{ .Values.search.name | quote }}
            - name: MONGOT_STS
              value: {{ include "mongodb-search-helm.mongotStatefulSet" . | quote }}
            - name: WAIT_SECONDS
              value: {{ .Values.wait.waitSeconds | quote }}
            - name: INTERVAL
              value: {{ .Values.wait.intervalSeconds | quote }}
            - name: CLAIM_WAIT
              value: {{ $claimWait | quote }}
            - name: SCRIPT
              value: /scripts/expand-mongot-volumes.sh
          args:
            - |
              set -uo pipefail
              log()  { printf '[expand %s] %s\n' "$(date -u +%H:%M:%S)" "$*"; }
              fail() { printf '[expand] FAILED: %s\n' "$*" >&2; exit 1; }
              MDBS=mongodbsearch.mongodb.com
              field() { oc get "$1" "$2" -n "$NAMESPACE" -o jsonpath="{$3}" 2>/dev/null; }
              script() { bash "$SCRIPT" "$@" --target-namespace "$NAMESPACE" --statefulset "$MONGOT_STS"; }

              # 1. The operator has seen the resource as it is now. Until it has, status.phase is the previous
              #    generation's, and a StatefulSet deleted while the operator is away is not made again.
              DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))
              observed() {
                local g; g="$(field "$MDBS" "$SEARCH" .metadata.generation)"
                [ -n "$g" ] && [ "$g" = "$(field "$MDBS" "$SEARCH" .status.observedGeneration)" ]
              }
              until observed; do
                [ "$(date +%s)" -lt "$DEADLINE" ] || fail "the operator has not reconciled MongoDBSearch ${SEARCH} at its current generation within ${WAIT_SECONDS}s. Nothing was changed. Inspect: oc get ${MDBS} ${SEARCH} -n ${NAMESPACE} -o yaml"
                log "waiting: MongoDBSearch ${SEARCH} reconciled at its current generation"
                sleep "$INTERVAL"
              done

              # 2. The plan: the sizes compared (what the resource asks for, what the StatefulSet's volumes were made
              #    at, what each claim asks for and has), and from them what is to be done, if anything. It reads only.
              script --plan; PLAN=$?
              case "$PLAN" in
                0)  log "the plan found nothing to do"; exit 0 ;;
                10) ;;
                *)  fail "the volumes could not be assessed, or what is asked is not supported or needs a person (the script ended with ${PLAN}): what it said is above. Nothing was changed." ;;
              esac

              # 3. Is it ours to do now? Either the operator has refused the new size (the gate's own test: Failed,
              #    with Kubernetes' sentence, the sizes different), or the resource is Running and what is left is
              #    the end of a growth (a resize to wait for, a pod to restart). In any other state (still being
              #    reconciled, Failed for another reason) nothing is touched, and the gate judges.
              {{- include "mongodb-search-helm.volumeSizeChanged" . | nindent 14 }}
              PHASE="$(field "$MDBS" "$SEARCH" .status.phase)"
              if volume_size_changed; then
                log "the operator has refused the new size (${WANT_SIZE}; StatefulSet ${MONGOT_STS} has ${HAVE_SIZE}): taking the steps of volume-expansion-runbook.md, with its script"
              elif [ "$PHASE" = "Running" ]; then
                log "MongoDBSearch ${SEARCH} is Running and the plan has something left to do: taking the steps of volume-expansion-runbook.md, with its script"
              else
                log "note: the plan has something to do, and MongoDBSearch ${SEARCH} is ${PHASE:-unknown} without the operator having refused a volume size: nothing is done in this state"
                exit 0
              fi

              # 4. The runbook's steps 3, 4, 4b and 6, in that order. Each does what the plan left for it and no
              #    more: a claim that has its size is not asked again, a StatefulSet that has it is not made again, a
              #    pod whose claim does not wait is not restarted. The script stops at the first claim or pod that
              #    is not as it should be. --restart-later: a claim whose volume has grown and whose file system
              #    waits for its pod (FileSystemResizePending for two minutes) is left, and the next claim is asked.
              script --expand --apply --yes --restart-later --wait "$CLAIM_WAIT" \
                || fail "the volume claims were not all grown (the script ended with $?). No pod, claim or StatefulSet was deleted, and the mongot pods run as before. What the script said is above; volume-expansion-runbook.md, step 3, says what each ending means. The next sync or upgrade goes on from here."
              script --recreate-statefulset --apply --yes --restart-later --wait "$CLAIM_WAIT" \
                || fail "the step that makes the StatefulSet again did not end well (the script ended with $?). What the script said is above, and it says whether the StatefulSet was deleted and whether it was made again; volume-expansion-runbook.md, step 4. Do NOT delete the mongot pods."
              # The StatefulSet has its size and the operator has its resource back. Now the pods whose claims
              # still wait for them, one at a time; where the storage grew every file system in use, none.
              script --restart-pending --apply --yes --wait "$CLAIM_WAIT" \
                || fail "a pod whose volume waits for it was not restarted, or did not come back (the script ended with $?). What the script said is above; volume-expansion-runbook.md, step 4b. A pod that was deleted keeps its claim. The next sync or upgrade plans again and takes up what is left, once the resource is Running."
              # Has it taken effect? The resource Running, the StatefulSet and every claim at the size, every pod
              # Ready, and the file system each pod sees as large as its claim.
              script --verify \
                || fail "the growth is not verified (the script ended with $?): what is not as it should be is named above, each with what to do. Nothing was deleted by this step. volume-expansion-runbook.md, step 6."
              log "StatefulSet ${MONGOT_STS} now has $(field statefulsets.apps "$MONGOT_STS" '.spec.volumeClaimTemplates[0].spec.resources.requests.storage') and MongoDBSearch ${SEARCH} is $(field "$MDBS" "$SEARCH" .status.phase): the gate decides the rest"
{{- end }}
