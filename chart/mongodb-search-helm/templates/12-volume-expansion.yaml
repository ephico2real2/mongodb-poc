{{- /*
Growing mongot's volumes from the values alone (search.persistence.autoExpand.enabled; off unless asked for).

A larger search.persistence.storage cannot reach a StatefulSet that exists: Kubernetes forbids a change of its
volume claim template, and the operator leaves the MongoDBSearch Failed. Without this Job the gate stops there and
names volume-expansion-runbook.md. With it, a Job between the MongoDBSearch and the gate takes the runbook's steps by
hand, with the runbook's own script, expand-mongot-volumes.sh, mounted from the chart: the claims are grown one pod
at a time, the StatefulSet is then deleted with --cascade=orphan for the operator to make again, and last, where a
volume's file system grows only when its pod is started again, that pod is restarted, one at a time.

It grows volumes on one signal only: the resource is Failed, the operator names the forbidden StatefulSet update, and
the two sizes differ. A first install, an upgrade that changes no size and any other failure pass through untouched.
Argo CD and Helm run a hook on every sync and upgrade: run a second time it finds nothing to grow. One thing it does
without that signal: where the resource is Running and a claim of the StatefulSet still waits for its pod (a growth
whose last step did not finish), it takes that last step.
*/ -}}
{{- if .Values.search.persistence.autoExpand.enabled }}
{{- $name := printf "%s-expand-volumes" (include "mongodb-search-helm.fullname" .) }}
{{- $claimWait := int .Values.search.persistence.autoExpand.claimWaitSeconds }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # The size this release asks for. Argo CD starts a sync only when an object it tracks differs, and a hook Job is
    # not one: with the size synced first and the flag set after, these four objects are what differs. Where they
    # were left by an earlier growth (an Application that does not prune), they would be as git has them, and
    # nothing would start; the size written here is what then differs. (Seen on the lab.)
    mongodb-search-helm/grows-to: {{ .Values.search.persistence.storage | quote }}
data:
  expand-mongot-volumes.sh: |
    {{- .Files.Get "expand-mongot-volumes.sh" | trimSuffix "\n" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# In this namespace only. It reads the one MongoDBSearch and the one StatefulSet by name, as the preflight does, and
# the pods and claims. It may ask a volume claim for more (a claim cannot be made smaller, and nothing else of a
# claim can be changed), and delete the mongot StatefulSet, by name. It may delete a mongot pod, by name, and no other
# pod: where a volume's file system grows only when its pod is started again, the script deletes that one pod, after
# the StatefulSet has been made again; the pod keeps its claim and comes back on it. It may not delete a claim.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: ["mongodb.com"]
    resources: ["mongodbsearch"]
    resourceNames: [{{ .Values.search.name | quote }}]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ include "mongodb-search-helm.mongotStatefulSet" . | quote }}]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- /* Never without names: a rule with an empty resourceNames is a rule for every pod. */}}
  {{- if gt (int .Values.search.replicas) 0 }}
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames:
      {{- range $i := until (int .Values.search.replicas) }}
      - {{ printf "%s-%d" (include "mongodb-search-helm.mongotStatefulSet" $) $i | quote }}
      {{- end }}
    verbs: ["delete"]
  {{- end }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "mongodb-search-helm.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
  annotations:
    # After the MongoDBSearch (wave 1), before the gate (wave 3).
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  # The operator's reconcile; for each pod its claim and its readiness (--expand waits for both, each up to the claim
  # wait); the StatefulSet made again; then, for each pod that has to be restarted, the two minutes its claim is
  # watched first, its claim and its readiness.
  activeDeadlineSeconds: {{ add .Values.wait.waitSeconds (mul 4 $claimWait (int .Values.search.replicas)) (mul 120 (int .Values.search.replicas)) $claimWait 120 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "mongodb-search-helm.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "mongodb-search-helm.jobPod" . | nindent 6 }}
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
      containers:
        - name: expand
          {{- include "mongodb-search-helm.jobContainer" . | nindent 10 }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          env:
            - name: NAMESPACE
              value: {{ include "mongodb-search-helm.namespace" . | quote }}
            - name: SEARCH
              value: {{ .Values.search.name | quote }}
            - name: MONGOT_STS
              value: {{ include "mongodb-search-helm.mongotStatefulSet" . | quote }}
            - name: WAIT_SECONDS
              value: {{ .Values.wait.waitSeconds | quote }}
            - name: INTERVAL
              value: {{ .Values.wait.intervalSeconds | quote }}
            - name: CLAIM_WAIT
              value: {{ $claimWait | quote }}
            - name: SCRIPT
              value: /scripts/expand-mongot-volumes.sh
          args:
            - |
              set -uo pipefail
              log()  { printf '[expand %s] %s\n' "$(date -u +%H:%M:%S)" "$*"; }
              fail() { printf '[expand] FAILED: %s\n' "$*" >&2; exit 1; }
              MDBS=mongodbsearch.mongodb.com
              field() { oc get "$1" "$2" -n "$NAMESPACE" -o jsonpath="{$3}" 2>/dev/null; }
              script() { bash "$SCRIPT" "$@" --target-namespace "$NAMESPACE" --statefulset "$MONGOT_STS"; }

              # 1. The operator has seen the resource as it is now. Until it has, status.phase is the previous
              #    generation's, and a StatefulSet deleted while the operator is away is not made again.
              DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))
              observed() {
                local g; g="$(field "$MDBS" "$SEARCH" .metadata.generation)"
                [ -n "$g" ] && [ "$g" = "$(field "$MDBS" "$SEARCH" .status.observedGeneration)" ]
              }
              until observed; do
                [ "$(date +%s)" -lt "$DEADLINE" ] || fail "the operator has not reconciled MongoDBSearch ${SEARCH} at its current generation within ${WAIT_SECONDS}s. Nothing was changed. Inspect: oc get ${MDBS} ${SEARCH} -n ${NAMESPACE} -o yaml"
                log "waiting: MongoDBSearch ${SEARCH} reconciled at its current generation"
                sleep "$INTERVAL"
              done

              # The runbook's step 4b: the pods whose claims still wait for them, one at a time; where the storage
              # grew every file system in use, none.
              restart_waiting() {
                script --restart-pending --apply --yes --wait "$CLAIM_WAIT" \
                  || fail "a pod whose volume waits for it was not restarted, or did not come back (the script ended with $?). The volumes have grown and the StatefulSet is made again. What the script said is above; volume-expansion-runbook.md, step 4b. A pod that was deleted keeps its claim. The next sync or upgrade takes this step again, for the claims that still wait."
              }
              # The claims of this StatefulSet (<template>-<StatefulSet>-<n>) whose file system waits for its pod.
              waiting_claims() {
                oc get persistentvolumeclaims -n "$NAMESPACE" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[*].type}{"\n"}{end}' 2>/dev/null \
                  | grep -E -- "-${MONGOT_STS}-[0-9]+ .*FileSystemResizePending" | cut -d' ' -f1 | tr '\n' ' '
              }

              # 2. Is there a changed volume size to act on? The gate's own test.
              {{- include "mongodb-search-helm.volumeSizeChanged" . | nindent 14 }}
              if ! volume_size_changed; then
                PHASE="$(field "$MDBS" "$SEARCH" .status.phase)"
                # No size to grow. A growth that got as far as the StatefulSet and no further (a pod that did not
                # come back in time, a Job that was stopped) has left the resource Running and claims that wait:
                # this sync takes that last step.
                WAITING="$(waiting_claims)"
                if [ -n "$WAITING" ] && [ "$PHASE" = "Running" ]; then
                  log "no changed volume size waits, and the file systems of these claims wait for their pods: ${WAITING}: taking step 4b of volume-expansion-runbook.md"
                  restart_waiting
                  log "MongoDBSearch ${SEARCH} is $(field "$MDBS" "$SEARCH" .status.phase): the gate decides the rest"
                  exit 0
                fi
                [ -z "$WAITING" ] || log "note: the file systems of these claims wait for their pods: ${WAITING}. MongoDBSearch ${SEARCH} is ${PHASE}, not Running: no pod is restarted until it is"
                log "MongoDBSearch ${SEARCH} is ${PHASE}, with no changed volume size waiting: nothing to grow"
                exit 0
              fi
              log "search.persistence.storage is now ${WANT_SIZE} and StatefulSet ${MONGOT_STS} has ${HAVE_SIZE}: taking the steps of volume-expansion-runbook.md, with its script"

              # 3. The runbook's steps 3, 4 and 5, in that order. The script stops at the first claim or pod that
              #    is not as it should be. --restart-later: a claim whose volume has grown and whose file system
              #    waits for its pod to be started again (FileSystemResizePending for two minutes) is left as it
              #    is, and the next claim is asked.
              script --check
              script --expand --apply --yes --restart-later --wait "$CLAIM_WAIT" \
                || fail "the volume claims were not all grown (the script ended with $?). No pod, claim or StatefulSet was deleted, and the mongot pods run as before. What the script said is above; volume-expansion-runbook.md, step 3, says what each ending means. The next sync or upgrade goes on from here."
              script --recreate-statefulset --apply --yes --restart-later --wait "$CLAIM_WAIT" \
                || fail "the StatefulSet was not made again at ${WANT_SIZE} (the script ended with $?). What the script said is above; volume-expansion-runbook.md, step 4. Do NOT delete the mongot pods."
              # The StatefulSet is made again and the operator has its resource back. Now the pods whose claims
              # still wait for them.
              restart_waiting
              # What the cluster says now, not what was asked for: --recreate-statefulset also ends well with "nothing to do".
              log "StatefulSet ${MONGOT_STS} now has $(field statefulsets.apps "$MONGOT_STS" '.spec.volumeClaimTemplates[0].spec.resources.requests.storage') and MongoDBSearch ${SEARCH} is $(field "$MDBS" "$SEARCH" .status.phase): the gate decides the rest"
{{- end }}
