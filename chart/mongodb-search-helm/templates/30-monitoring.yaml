{{- /*
Optional: per-pod scraping and the distribution alerts of manifests/50, 90 and 96. Losing L7 balancing produces
no error (queries succeed, pods stay Ready), so the only way to see it is to compare the pods' shares.

The objects are named after search.name, as the hand-applied ones are, so an existing set can be adopted.
A ServiceMonitor scrapes endpoints, not the Service's address, so each pod is its own series.
*/ -}}
{{- if .Values.monitoring.serviceMonitors.enabled }}
# Envoy's admin port, read-only: the operator restricts it to /stats, /ready, /logging and /drain_listeners.
# ClusterIP only; never give it a Route.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongodb-search-helm.envoyStatsService" . }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability
    mongodb.com/search-name: {{ .Values.search.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "mongodb-search-helm.lbDeployment" . }}
  ports:
    - name: admin
      port: 9901
      targetPort: 9901
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.search.name }}
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ include "mongodb-search-helm.mongotService" . }}
  endpoints:
    - port: prometheus
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitors.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.search.name }}-envoy
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitors.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: observability
      mongodb.com/search-name: {{ .Values.search.name }}
  endpoints:
    - port: admin
      # The operator's admin allowlist matches on the prefix /stats.
      path: /stats/prometheus
      interval: {{ .Values.monitoring.serviceMonitors.interval }}
      # Envoy names these two counters without the _total that Prometheus expects of a counter. rate() on such
      # a name is answered with a notice, "metric might not be a counter", which Thanos Querier returns as a
      # warning and both Perses and Grafana show as a warning sign on the panel. They get the suffix here, at
      # the scrape; the dashboards and the alert below use the suffixed names.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: (envoy_cluster_upstream_rq_(?:retry|xx))
          targetLabel: __name__
          replacement: ${1}_total
{{- end }}
{{- if .Values.monitoring.alerts.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.search.name }}-distribution
  namespace: {{ include "mongodb-search-helm.namespace" . }}
  labels:
    {{- include "mongodb-search-helm.labels" . | nindent 4 }}
    {{- with .Values.monitoring.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: mongot.distribution
      rules:
        # Per-pod share of search traffic.
        - record: mongot:search_rate:pod
          expr: |
            sum by (pod) (rate(mongot_command_searchCommandTotalLatency_seconds_count[5m]))
              + sum by (pod) (rate(mongot_command_vectorSearchCommandTotalLatency_seconds_count[5m]))
        - record: mongot:search_rate:total
          expr: sum(mongot:search_rate:pod)
        - record: mongot:search_share:pod
          expr: mongot:search_rate:pod / ignoring(pod) group_left mongot:search_rate:total

        - alert: MongotTrafficNotDistributed
          expr: |
            max(mongot:search_share:pod) > 0.90
              and on() (mongot:search_rate:total > 0.2)
              and on() (count(count by (pod) (mongot:search_rate:pod)) > 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{`"One mongot pod is serving {{ $value | humanizePercentage }} of search traffic"`}}
            description: >-
              Search traffic is concentrated on a single mongot pod while others are idle.
              Queries will still succeed and every pod will still report Ready, so nothing
              else will alert. The usual cause is that the L7 proxy has been bypassed: check
              that the entry Service selects app={{ include "mongodb-search-helm.lbDeployment" . }} (the Envoy pods)
              and not the mongot pods, and that Envoy is running.
            runbook: {{ .Values.monitoring.alerts.runbookUrl | quote }}

        - alert: MongotPodReceivingNoTraffic
          expr: |
            (mongot:search_rate:pod == 0)
              and on() (mongot:search_rate:total > 0.5)
          for: 15m
          labels:
            severity: info
          annotations:
            summary: {{`"mongot pod {{ $labels.pod }} has served nothing for 15m while others are busy"`}}
            description: >-
              The pod is Ready and scraped, but Envoy is sending it no requests. Expected
              briefly after a restart while it re-syncs; sustained, it suggests the pod is
              missing from Envoy's upstream set.

        - alert: MongotEnvoyRetriesElevated
          expr: sum(rate(envoy_cluster_upstream_rq_retry_total[5m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{`"Envoy is retrying {{ $value | printf \"%.1f\" }} req/s to mongot"`}}
            description: >-
              mongot is returning RESOURCE_EXHAUSTED (load shedding) or resetting streams, and
              Envoy is retrying onto a different pod. Sustained retries mean the mongot tier is
              undersized for the query rate.

        - alert: MongotNoSearchTraffic
          # The jobs are named after the two scraped Services, so the pattern follows search.name.
          expr: |
            sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name="mongot_rs_cluster"}[5m])) == 0
              and on() (count(up{job=~"{{ include "mongodb-search-helm.mongotService" . }}|{{ include "mongodb-search-helm.envoyStatsService" . }}"} == 1) > 0)
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "Envoy has forwarded no requests to mongot for 30m"
            description: >-
              Either genuinely idle, or mongod has stopped reaching the load balancer. Check
              mongotHost on the external mongod and that the Route still resolves.

    # An index in trouble. mongot's metrics name an index by its id (the label indexId_logString): the dashboard's
    # section "What does each index hold?" shows the same id, and its name with monitoring.indexInfo. Searches go on
    # being answered while an index is STALE or RECOVERING, and stop for it only when it is FAILED or being built.
    - name: mongot.indexes
      rules:
        - alert: MongotIndexFailed
          expr: max by (indexId_logString, pod) (mongot_index_stats_indexStatusCode{status="FAILED"}) == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: {{`"Search index {{ $labels.indexId_logString }} has failed on {{ $labels.pod }}"`}}
            description: >-
              mongot reports this index FAILED on this pod: it answers no search from it there. The pod's log says
              why. The index's name is in the source deployment: $listSearchIndexes lists it by this id.
            runbook: {{ .Values.monitoring.alerts.runbookUrl | quote }}

        - alert: MongotIndexNotFollowing
          expr: max by (indexId_logString, pod) (mongot_index_stats_indexStatusCode{status=~"STALE|RECOVERING_NON_TRANSIENT"}) == 1
          # Ten minutes is this chart's choice: long enough for a restart of the source to pass.
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{`"Search index {{ $labels.indexId_logString }} has stopped following the source on {{ $labels.pod }}"`}}
            description: >-
              The index is STALE or recovering from an error that is not transient on this pod. Searches are still
              answered from it, with what it held when it stopped: results fall behind the collection.

        - alert: MongotIndexBuildRetrying
          expr: max by (indexId_logString, pod) (mongot_index_stats_indexing_consecutiveInitialSyncResyncExceptions) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: {{`"The build of search index {{ $labels.indexId_logString }} keeps failing on {{ $labels.pod }}"`}}
            description: >-
              The initial sync of this index has failed and started again, {{`{{ $value }}`}} times in a row, for 15
              minutes. Until it completes the index is not served from this pod.

        - alert: MongotIndexesDifferByPod
          # An index some pod does not report; or one whose document count is not the same on every pod, when it can
          # be compared: STEADY on every pod, and not written to for 10 minutes.
          # - Not written to: each pod is read at its own instant, so the counts of an index that is being written
          #   to never agree. On the lab, two inserts a second kept three pods 17 to 24 documents apart at every
          #   one of 53 readings, and the alert without this condition fired after its 10 minutes.
          # - STEADY: every pod builds an index at its own pace, and a rebuild or a recovery that is not transient
          #   keeps the old generation beside the new one (the label generationId_logString), so a generation is
          #   compared with itself.
          # - Sizes are not compared: each pod writes its own index files. On the lab the same 605 documents took
          #   112,781 bytes on two pods and 113,402 on the third, and still did after 12 quiet minutes.
          expr: |
            (count by (indexId_logString) (max by (indexId_logString, pod) (mongot_index_stats_indexSizeBytes))
                != scalar(count(count by (pod) (mongot_index_stats_indexSizeBytes))))
              or max by (indexId_logString) (
                (max by (indexId_logString, generationId_logString) (mongot_index_stats_numLuceneDocs)
                  != min by (indexId_logString, generationId_logString) (mongot_index_stats_numLuceneDocs))
                and on (indexId_logString, generationId_logString) (
                  count by (indexId_logString, generationId_logString) (max by (indexId_logString, generationId_logString, pod) (mongot_index_stats_indexStatusCode{status="STEADY"}) == 1)
                    == scalar(count(count by (pod) (mongot_index_stats_indexSizeBytes)))
                )
                and on (indexId_logString, generationId_logString) (
                  max by (indexId_logString, generationId_logString) (changes(mongot_index_stats_numLuceneDocs[10m])) == 0
                )
              )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{`"Search index {{ $labels.indexId_logString }} is not the same on every mongot pod"`}}
            description: >-
              Every mongot pod holds every index, so the same search can return different results depending on the
              pod that answers. The dashboard's table "Each mongot pod, now" shows which pod differs.

        - alert: MongotIndexSearchesFailing
          expr: sum by (indexId_logString) (rate(mongot_index_stats_query_failedQueries_total[5m])) > 0
          # Five minutes is this chart's choice.
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: {{`"Searches on index {{ $labels.indexId_logString }} are failing"`}}
            description: >-
              mongot failed searches on this index for 5 minutes, {{`{{ $value | printf "%.3f" }}`}} a second (one failure in
              five minutes is 0.003). A search the index refuses counts too, such as an operator on a field the index
              does not define: mongot_index_stats_query_invalidQueries_total, per pod and not per index, counts those alone.
{{- end }}
