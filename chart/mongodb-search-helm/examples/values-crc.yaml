# The lab: CRC, namespace mongodb-poc, with the values of manifests/88-tls-search-managed-envoy.yaml and
# 80-route-passthrough.yaml. The secrets and the trust bundle already in the namespace are used as they are.
#   helm install mongot chart/mongodb-search-helm -n mongodb-poc -f chart/mongodb-search-helm/examples/values-crc.yaml --timeout 20m
namespace: mongodb-poc
search:
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {cpu: "1", memory: 2Gi}
  persistence:
    storage: 2Gi
    storageClass: crc-csi-hostpath-provisioner
loadBalancer:
  externalHostname: grpc-search.apps-crc.testing
source:
  hostAndPorts:
    - 192.168.64.4:27017
    - 192.168.64.4:27018
    - 192.168.64.4:27019
  username: search-sync-source
  passwordSecret:
    name: mongot-search-sync-source-password
route:
  name: mongot-grpc                    # the lab's Route name; it targets the operator's mongot-search-0-proxy-svc
