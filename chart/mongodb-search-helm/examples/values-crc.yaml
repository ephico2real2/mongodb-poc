# The lab: CRC, namespace mongodb-poc. The secrets and the trust bundle already in the namespace are used as they
# are. These are the values the lab's release runs with: change the lab by changing this file.
#   helm upgrade --install mongot chart/mongodb-search-helm -n mongodb-poc -f chart/mongodb-search-helm/examples/values-crc.yaml --timeout 20m
namespace: mongodb-poc
search:
  resources:
    requests: {cpu: 200m, memory: 1100Mi}
    limits: {cpu: "1", memory: 2Gi}
  persistence:
    storage: 4Gi
    storageClass: crc-csi-hostpath-provisioner
loadBalancer:
  externalHostname: grpc-search.apps-crc.testing
source:
  hostAndPorts:
    - 192.168.64.4:27017
    - 192.168.64.4:27018
    - 192.168.64.4:27019
  username: search-sync-source
  passwordSecret:
    name: mongot-search-sync-source-password
route:
  name: mongot-grpc                    # the lab's Route name; it targets the operator's mongot-search-0-proxy-svc
monitoring:
  grafanaDashboard: true
  # Needs the Secret search-index-info-password and the user it belongs to on the lab's mongod.
  indexInfo:
    enabled: true
    uriOptions: replicaSet=rs0
  alerts:
    # Lab only: lowered so that MongotDataPathFillingUp fires on the lab's disk, which is about 63% used, and can
    # be seen in the console. The chart's own levels are 70, 80 and 90 (values.yaml).
    dataPathUsed: {info: 50, warning: 55, critical: 60}
