# The lab: CRC, namespace mongodb-poc. The secrets and the trust bundle already in the namespace are used as they
# are. The lab is run by Argo CD (argocd-application-crc.yaml, beside this file), which reads these values from
# main: change the lab by changing this file there. Argo CD syncs it by itself.
namespace: mongodb-poc
search:
  resources:
    requests: {cpu: 200m, memory: 1100Mi}
    limits: {cpu: "1", memory: 2Gi}
  persistence:
    # The lab's NFS class (driver nfs.csi.k8s.io, csi-driver-nfs 4.13.4 with its resizer), since 2026-10-10: a
    # class whose claims can grow, which the lab's default hostpath class cannot. It was 4Gi when installed and
    # was grown to 5Gi, 6Gi, 7Gi and 8Gi with volume-expansion-runbook.md, and from there to 14Gi, 1Gi at a time, by
    # the chart's own Job (autoExpand, below; the repository's docs/investigating-automatic-volume-expansion.md). A
    # volume cannot be made smaller: do not lower this number. Each claim is a directory of one NAS export: a pod
    # sees the export's size, not this.
    storage: 15Gi
    storageClass: ipsec-nas-csi
    autoExpand:
      enabled: false
loadBalancer:
  externalHostname: grpc-search.apps-crc.testing
source:
  hostAndPorts:
    - 192.168.64.4:27017
    - 192.168.64.4:27018
    - 192.168.64.4:27019
  username: search-sync-source
  passwordSecret:
    name: mongot-search-sync-source-password
route:
  name: mongot-grpc                    # the lab's Route name; it targets the operator's mongot-search-0-proxy-svc
monitoring:
  # A ConfigMap for a Grafana dashboard sidecar: the lab's Grafana (release grafana-validate) reads it; harmless
  # on a namespace without one.
  grafanaDashboard: true
  # Needs the Secret search-index-info-password and the user it belongs to on the lab's mongod. Neither is made by
  # generate-mongodbsearch-prerequisites.sh: the README, "Index names, as metrics", has the two commands.
  indexInfo:
    enabled: true
    uriOptions: replicaSet=rs0
  alerts:
    # Lab only: lowered so that MongotDataPathFillingUp fired on the node's disk, about 63% used, while the lab's
    # volumes were on the hostpath class. On the NFS class above the pods read the NAS export, 20% used on
    # 2026-10-10, so at these levels the alert does not fire. The chart's own levels are 70, 80 and 90
    # (values.yaml).
    dataPathUsed: {info: 50, warning: 55, critical: 60}
