# MongoDB Search through Argo CD (OpenShift GitOps): argocd.md, beside the chart, is the page for it. The namespace
# and the five prerequisites must exist first, so there is no CreateNamespace here. The lab's own Application is
# argocd-application-crc.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-search
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ephico2real2/mongodb-poc.git
    # A release tag: a sync then changes only when this line does.
    targetRevision: mongodb-search-helm-0.3.24
    path: chart/mongodb-search-helm
    helm:
      # The chart's object names start with the release name. Argo CD would use the Application's name: give the
      # name the Helm commands of the documents use, so that Helm and Argo CD can take over from each other.
      releaseName: mongot
      # The MongoDBSearch CRD then comes from OLM, before the resource's wave. Without this Argo CD would track a
      # CRD that OLM manages and other namespaces may use, and could delete it with the Application.
      skipCrds: true
      valueFiles:
        - examples/values-dvh-gp6-rnd.yaml
      # Keeps the MongoDBSearch, and so every mongot volume, through a prune and through the deletion of this
      # Application. Take it out only to let Argo CD delete the search. Not `forceString: true`: the chart's schema
      # wants a boolean.
      parameters:
        - name: search.keepOnUninstall
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: dvh-gp6-rnd
  # The router writes the Route's status; do not report it as drift.
  ignoreDifferences:
    - group: route.openshift.io
      kind: Route
      jsonPointers: [/status]
  # By hand. `automated: {}` and `automated: {prune: true}` were also run with the parameter above: a prune skips
  # the MongoDBSearch. Without the parameter, do not prune: it deletes the search and its volumes.
  syncPolicy: {}
