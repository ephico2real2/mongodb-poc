# The StorageClass exactly as CRC created it (2026-07-30), before allowVolumeExpansion was
# enabled. Restore with:
#   oc replace -f enhancement/backup/storageclass-crc-csi-hostpath-provisioner.restore.yaml
# A StorageClass's parameters, provisioner and reclaimPolicy are immutable; this file only
# puts allowVolumeExpansion back to its original value (absent = false).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: crc-csi-hostpath-provisioner
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
parameters:
  storagePool: local
provisioner: kubevirt.io.hostpath-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
