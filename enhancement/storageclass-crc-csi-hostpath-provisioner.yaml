# crc-csi-hostpath-provisioner with volume expansion allowed - the state applied on
# 2026-09-26. Only allowVolumeExpansion differs from what CRC created
# (backup/storageclass-crc-csi-hostpath-provisioner.restore.yaml).
#
# allowVolumeExpansion is one of the few StorageClass fields that can be changed in place:
#   oc patch sc crc-csi-hostpath-provisioner --type=merge -p '{"allowVolumeExpansion":true}'
# or: oc apply -f this file.
#
# It is PERMISSION, not capability: it lets the API server accept a larger size on a
# claim. On this driver nothing then performs the expansion - see
# storage-volume-expansion.md, "What enabling it does - measured".
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: crc-csi-hostpath-provisioner
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
parameters:
  storagePool: local
provisioner: kubevirt.io.hostpath-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
