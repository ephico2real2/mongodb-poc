# Part A: a throwaway claim and a pod that mounts it, to see what a resize does on
# crc-csi-hostpath-provisioner. The class binds on first consumer, so the pod is what
# provisions the volume. The pod writes a marker file, to show the data survives.
apiVersion: v1
kind: Namespace
metadata:
  name: sc-expansion-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resize-me
  namespace: sc-expansion-test
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: crc-csi-hostpath-provisioner
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Pod
metadata:
  name: user
  namespace: sc-expansion-test
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: sh
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command: ["sh", "-c", "echo written-before-resize > /data/marker && sleep infinity"]
    volumeMounts: [{ name: data, mountPath: /data }]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
  volumes:
  - name: data
    persistentVolumeClaim: { claimName: resize-me }
