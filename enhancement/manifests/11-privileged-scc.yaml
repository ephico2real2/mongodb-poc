# Part B, step 3: the one privileged grant. The NFS server (10-nfs-server.yaml) must
# mount /proc/fs/nfsd and start the kernel's NFS server, which only a privileged pod can
# do. This RoleBinding lets exactly one ServiceAccount - nfs-server in namespace
# nfs-server - use OpenShift's privileged SCC. Nothing else in the namespace gets it.
#
# Review before applying: a privileged pod can do anything on the node it runs on.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfs-server-privileged-scc
  namespace: nfs-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: nfs-server
  namespace: nfs-server
