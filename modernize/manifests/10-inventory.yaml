# Layer 1 of 3: the backend. It speaks gRPC and nothing else - no HTTP server,
# no JSON, no CORS. A browser cannot call it and neither can curl.
#
# Packaged the same way as the search GUI in this repository: source from a
# ConfigMap on a stock python image, so there is no image to build and no
# registry to push to. grpcio is installed at start; the pod needs egress to
# pypi for that first few seconds.
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: modernize-demo
  labels: { app: inventory }
spec:
  selector: { app: inventory }
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: modernize-demo
  labels: { app: inventory }
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory } }
  template:
    metadata:
      labels: { app: inventory }
    spec:
      containers:
      - name: inventory
        image: python:3.12-slim
        command: ["/bin/sh","-c"]
        args:
          - |
            # OpenShift runs this container as a random UID with no writable
            # HOME, so a default `pip install` fails with
            #   Permission denied: '/.local'
            # Install into a writable emptyDir and point PYTHONPATH at it.
            # googleapis-common-protos supplies google.api.annotations_pb2, which
            # the generated stub imports because inventory.proto imports the http
            # annotations. The service never reads them - only Envoy does - but the
            # generated module will not import without the package present.
            pip install --no-cache-dir --quiet --target=/pylibs \
                grpcio grpcio-reflection protobuf googleapis-common-protos
            exec python /app/server.py
        env:
        - name: PORT
          value: "50051"
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONPATH
          value: "/pylibs:/app"
        ports:
        - { name: grpc, containerPort: 50051 }
        volumeMounts:
        - { name: src,    mountPath: /app }
        - { name: pylibs, mountPath: /pylibs }
        readinessProbe:
          tcpSocket: { port: 50051 }
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 30
        resources:
          requests: { cpu: "50m",  memory: "128Mi" }
          limits:   { cpu: "500m", memory: "512Mi" }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
      volumes:
      - name: src
        configMap: { name: inventory-src }
      - name: pylibs
        emptyDir: {}
