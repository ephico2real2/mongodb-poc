# mongot-gui as a reusable component: a search GUI that shows WHICH mongot pod answered.
#
# No namespace here - apply it with -n, or use app/gui/deploy.sh, which also creates the
# three objects this manifest expects (see app/gui/README.md):
#
#   ConfigMap mongot-gui-src      the code: server.py, mounted at /app
#   ConfigMap mongot-gui-config   settings as env vars (optional - every one has a default)
#   Secret    mongot-gui-mongo-uri  key `uri`: the MongoDB connection string (never in git)
#
# The image is the stock MongoDB Community Server image, used only because it already ships
# python3 and mongosh. It is not built for this GUI. quay.io and docker.io publish the same
# image: index sha256:fc8c72e0..., identical amd64 and arm64 digests (checked 2026-09-28).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongot-gui
  labels: { app: mongot-gui }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongot-gui } }
  template:
    metadata:
      labels: { app: mongot-gui }
      annotations:
        # deploy.sh replaces this with a hash of server.py + mongot-gui-config, so a code
        # or settings change rolls the pod in the same apply; unchanged, it is a no-op.
        mongot-gui/config-hash: "unset"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: gui
        image: quay.io/mongodb/mongodb-community-server:8.3.4-ubi9
        command: ["python3", "/app/server.py"]
        env:
        - name: MONGO_URI
          valueFrom: { secretKeyRef: { name: mongot-gui-mongo-uri, key: uri } }
        envFrom:
        - configMapRef: { name: mongot-gui-config, optional: true }
        ports: [{ name: http, containerPort: 8080 }]
        volumeMounts: [{ name: src, mountPath: /app }]
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 512Mi }
      volumes:
      - name: src
        configMap: { name: mongot-gui-src }
---
apiVersion: v1
kind: Service
metadata: { name: mongot-gui, labels: { app: mongot-gui } }
spec:
  selector: { app: mongot-gui }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: mongot-gui, labels: { app: mongot-gui } }
spec:
  to: { kind: Service, name: mongot-gui }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
