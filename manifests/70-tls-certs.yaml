# Workload certificates for the search path, all signed by the enterprise CA
# (manifests/65-enterprise-ca.yaml). No CA lives in this namespace.
#
# Secret names are NOT free choice - the operator derives them from
# spec.security.tls.certsSecretPrefix and the CR name:
#   <prefix>-<name>-search-lb-<idx>-cert          Envoy server cert  (faces mongod)
#   <prefix>-<name>-search-lb-<idx>-client-cert   Envoy -> mongot client cert
#   <prefix>-<name>-search-cert                   mongot server cert
# Here prefix=lab, name=mongot, idx=0.
---
# Envoy's server certificate.
#
# ONE certificate serves BOTH entry paths, because both terminate on the same Envoy and
# every L4 hop in front of it (the passthrough Route here, an F5 passthrough VIP in an
# enterprise) forwards the ClientHello untouched. The hostname identifies the SERVICE;
# the entry path is chosen by IP:port.
#
#   grpc-search.apps-crc.testing:443     -> router (HAProxy) -> Envoy      Lab 2
#   grpc-search.apps-crc.testing:27028   -> forwarder -> MetalLB VIP -> Envoy   Lab 1
#
# The CN/first SAN MUST equal spec.clusters[].loadBalancer.managed.externalHostname, and
# must also equal the Route host: mongod sends it as SNI, the router selects the Route by
# it, and Envoy matches its one filter chain on it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: lab-mongot-search-lb-0-cert, namespace: mongodb-poc }
spec:
  secretName: lab-mongot-search-lb-0-cert
  commonName: grpc-search.apps-crc.testing
  dnsNames:
  # The one name Envoy actually matches. Used by BOTH labs, on different ports.
  - grpc-search.apps-crc.testing
  # A SPARE SAN, kept so the certificate is ready if the VIP is ever split onto its own
  # name and its own MongoDBSearch. Do NOT set it as mongotHost today: a ReplicaSet source
  # gets exactly ONE SNI name. Verified behaviour if you do - on :27028 Envoy closes the
  # handshake and serves no certificate. On :443 the name is absent from the router's
  # os_sni_passthrough.map, so the connection is never classified as passthrough traffic
  # and falls into the shared termination flow (be_sni), which binds the router's default
  # certificate with no-alpn. TLS "works" and never reaches Envoy.
  - vip-grpc-search.apps-crc.testing
  # The in-cluster name, which is what the operator would use if externalHostname were unset.
  - mongot-search-0-proxy-svc.mongodb-poc.svc.cluster.local
  # IP SANs are for completeness, not function. A client that dials an IP sends NO SNI, so
  # no filter chain matches and the connection closes before the certificate is ever
  # validated. They are here so `openssl s_client -connect <ip> -servername <name>` and
  # IP-based probes do not additionally fail certificate validation.
  ipAddresses:
  - 192.168.127.100    # the MetalLB VIP itself
  - 192.168.64.1       # what both records resolve to from the mongod containers (bridge100)
  - 192.168.127.2      # what *.apps-crc.testing resolves to INSIDE the cluster (br-ex)
  usages: [server auth, digital signature, key encipherment]
  issuerRef: { name: enterprise-ca, kind: ClusterIssuer, group: cert-manager.io }
---
# Envoy's client certificate for the upstream leg to mongot.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: lab-mongot-search-lb-0-client-cert, namespace: mongodb-poc }
spec:
  secretName: lab-mongot-search-lb-0-client-cert
  commonName: envoy-client
  usages: [client auth, digital signature, key encipherment]
  issuerRef: { name: enterprise-ca, kind: ClusterIssuer, group: cert-manager.io }
---
# mongot's server certificate, covering the headless Service and every pod FQDN.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: lab-mongot-search-cert, namespace: mongodb-poc }
spec:
  secretName: lab-mongot-search-cert
  commonName: mongot-search-0-svc.mongodb-poc.svc.cluster.local
  dnsNames:
  - mongot-search-0-svc.mongodb-poc.svc.cluster.local
  - "*.mongot-search-0-svc.mongodb-poc.svc.cluster.local"
  - mongot-search-0-proxy-svc.mongodb-poc.svc.cluster.local
  usages: [server auth, client auth, digital signature, key encipherment]
  issuerRef: { name: enterprise-ca, kind: ClusterIssuer, group: cert-manager.io }
---
# The external mongod's server certificate. Required because enabling Envoy TLS on an
# external source also switches the mongot -> mongod sync leg to TLS (see design notes
# section 8). mongot validates this against the CA in spec.source.external.tls.ca.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: external-mongod-cert, namespace: mongodb-poc }
spec:
  secretName: external-mongod-cert
  commonName: mongod.lab.internal
  dnsNames:
  - mongod.lab.internal
  ipAddresses:
  - 192.168.64.4                             # what the replica set advertises
  usages: [server auth, client auth, digital signature, key encipherment]
  issuerRef: { name: enterprise-ca, kind: ClusterIssuer, group: cert-manager.io }
