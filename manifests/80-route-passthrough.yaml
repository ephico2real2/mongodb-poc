# Passthrough Route entry - the alternative to a MetalLB VIP, and the shape that fits
# an F5 fronting the OpenShift infra nodes.
#
# VERIFIED serving $search and $vectorSearch with TLS, distributing 13/13/14 across
# three mongot. Requires TLS: passthrough selects the backend by SNI, and SNI exists
# only inside a TLS ClientHello. Against a plaintext Envoy this returns DPE/400.
#
# It targets mongot-search-lb from 30-envoy-direct-service.yaml, not the operator's
# mongot-search-0-proxy-svc. Both select the same Envoy pods; ours is stable because it
# is not garbage-collected with the CR and not named after it. With a Route you need
# neither MetalLB nor a LoadBalancer Service.
#
# BEHIND A CUSTOM F5. The same Route serves an F5 passthrough VIP fronting the infra
# nodes. The F5 must not terminate TLS either: L4/fastL4 virtual server, no client-SSL
# and no server-SSL profile. TLS terminates once, at Envoy, using the certificate the
# MongoDBSearch CR references. See README, "Behind a custom F5".
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mongot-grpc
  namespace: mongodb-poc
  annotations:
    # A passthrough Route DOES honour this annotation - the router template reads it for
    # TCP backends before falling back to ROUTER_TCP_BALANCE_SCHEME. Valid values are
    # roundrobin | leastconn | source | random.
    #
    # The passthrough DEFAULT is `source`, and that is degenerate here: every client
    # reaches the router through one ingress path, so HAProxy sees a single peer address
    # (192.168.127.1 on CRC) and hashes every connection onto the SAME Envoy replica.
    # Measured under `source`: 26,605 requests on one Envoy, 0 on the other.
    #
    # Measured after switching to roundrobin: 10 fresh TLS connections split 5/5 across
    # the two Envoy replicas.
    #
    # This balances CONNECTIONS, not requests - HAProxy is in TCP mode here. An already
    # established mongod connection does not move; this decides where the NEXT one lands.
    # Per-request spreading across mongot still happens only at Envoy.
    haproxy.router.openshift.io/balance: roundrobin
spec:
  # MUST equal spec.clusters[].loadBalancer.managed.externalHostname, because mongod
  # sends it as SNI, the router selects this Route by it, and Envoy matches its
  # filter chain on it. It must also be a SAN on the Envoy server certificate.
  host: grpc-search.apps-crc.testing
  to:
    kind: Service
    name: mongot-search-lb              # manifests/30-envoy-direct-service.yaml
    weight: 100                         # ours, not the operator's - that one is
                                        # owner-referenced by the CR and named after it
  port:
    targetPort: 27028                   # the numeric port, not a port name
  tls:
    termination: passthrough            # NOT edge (no HTTP/2) and not reencrypt
                                        # (timeout server = 30s cuts search cursors)
  wildcardPolicy: None
