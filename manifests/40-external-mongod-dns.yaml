# Give the external replica set a stable in-cluster FQDN WITHOUT touching CoreDNS.
# A selector-less headless Service + a hand-written EndpointSlice is the supported
# Kubernetes pattern for naming an off-cluster endpoint.
#   -> mongod-external.mongodb-poc.svc.cluster.local resolves to 192.168.64.4
apiVersion: v1
kind: Service
metadata:
  name: mongod-external
  namespace: mongodb-poc
spec:
  clusterIP: None          # headless: DNS returns the endpoint IP itself, no proxying
  ports:
  - { name: member1, port: 27017, protocol: TCP }
  - { name: member2, port: 27018, protocol: TCP }
  - { name: member3, port: 27019, protocol: TCP }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mongod-external-v4
  namespace: mongodb-poc
  labels:
    kubernetes.io/service-name: mongod-external
addressType: IPv4
ports:
- { name: member1, port: 27017, protocol: TCP }
- { name: member2, port: 27018, protocol: TCP }
- { name: member3, port: 27019, protocol: TCP }
endpoints:
- addresses: ["192.168.64.4"]
  conditions: { ready: true }
