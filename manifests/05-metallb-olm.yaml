# MetalLB via OLM. Verified: packagemanifest metallb-operator -> catalog redhat-operators,
# channel stable, currentCSV metallb-operator.v4.22.0-202609151747
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: metallb-operator
  namespace: metallb-system
spec: {}   # AllNamespaces: MetalLB does not support OwnNamespace install mode
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: metallb-operator-sub
  namespace: metallb-system
spec:
  channel: stable
  name: metallb-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
