# The operator hardcodes its proxy Service to ClusterIP with no override,
# so this is our own LoadBalancer Service selecting the managed Envoy pods.
apiVersion: v1
kind: Service
metadata:
  name: mongot-grpc-lb
  namespace: mongodb-poc
  annotations:
    metallb.universe.tf/address-pool: mongot-pool
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    # The trailing index is the CLUSTER index, not a replica index. Raising
    # loadBalancer.managed.replicas adds pods under this same label and needs no change
    # here; a second spec.clusters[] entry would create mongot-search-lb-1 and need its
    # own Service. See manifests/30-envoy-direct-service.yaml for the detail.
    app: mongot-search-lb-0        # <MongoDBSearch name>-search-lb-<clusterIndex>
  ports:
  - name: grpc
    port: 27028
    targetPort: 27028              # EnvoyDefaultProxyPort
    protocol: TCP
