# The repository's search GUI (app/gui/server.py) in mesh0, set up for the mesh: it can send a search through any
# cluster's member (MEMBERS) and reads every mongot pod's counters (MONGOT_TARGETS), so it shows which cluster's
# mongot, and which of its pods, answered. Applied by scripts/gui-up.sh, which makes the ConfigMap of the code and the Secret of the
# connection string. A LoadBalancer address from mesh0's block (172.18.255.200-239).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongot-gui
  namespace: search
  labels: {app: mongot-gui}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mongot-gui}
  template:
    metadata:
      labels: {app: mongot-gui}
    spec:
      # The image's user is the name mongod, 1000:1000: by number, or runAsNonRoot cannot be verified (OpenShift
      # assigns one itself; kind does not).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gui
          # The stock MongoDB Community Server image: it has python3 and mongosh (app/gui/README.md).
          image: quay.io/mongodb/mongodb-community-server:8.3.4-ubi9
          command: ["python3", "/app/server.py"]
          env:
            - name: MONGO_URI
              valueFrom: {secretKeyRef: {name: mongot-gui-mongo-uri, key: uri}}
            - name: MEMBERS
              value: mesh0=mongo-mesh0.mongodb.svc.cluster.local:27017,mesh1=mongo-mesh1.mongodb.svc.cluster.local:27017,mesh2=mongo-mesh2.mongodb.svc.cluster.local:27017
            - name: MONGOT_TARGETS
              value: mesh0/0=http://mongot-metrics-mesh0-0.search.svc.cluster.local:9946/metrics,mesh0/1=http://mongot-metrics-mesh0-1.search.svc.cluster.local:9946/metrics,mesh1/0=http://mongot-metrics-mesh1-0.search.svc.cluster.local:9946/metrics,mesh1/1=http://mongot-metrics-mesh1-1.search.svc.cluster.local:9946/metrics,mesh2/0=http://mongot-metrics-mesh2-0.search.svc.cluster.local:9946/metrics,mesh2/1=http://mongot-metrics-mesh2-1.search.svc.cluster.local:9946/metrics
            # mongosh keeps its own files under HOME; the image's home is not writable as this user.
            - name: HOME
              value: /tmp
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: src, mountPath: /app}
            - {name: ca, mountPath: /ca, readOnly: true}
      volumes:
        - name: src
          configMap: {name: mongot-gui-src}
        # The lab's root CA, which signs every mongod's certificate.
        - name: ca
          configMap: {name: ent-trust-bundle}
---
apiVersion: v1
kind: Service
metadata:
  name: mongot-gui
  namespace: search
  labels: {app: mongot-gui}
spec:
  type: LoadBalancer
  selector: {app: mongot-gui}
  ports:
    - {name: http, port: 80, targetPort: 8080}
