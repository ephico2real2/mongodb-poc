# The cluster's identity in the mesh: the name and id must be unique across the mesh, and the id is part of every
# security identity Cilium issues, so it is set at install and never changed.
cluster:
  name: mesh0
  id: 1
# Hubble's UI in mesh0 only: its relay reaches every node of the three clusters (one CA), so one UI shows the mesh.
hubble:
  ui:
    enabled: true
