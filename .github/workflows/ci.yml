# The repository's checks that need no cluster. test/run.sh needs the lab and stays a person's to run.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # test/chart.sh: helm lint, the renders, the schema's refusals, the dashboards' structure, shellcheck on the Job
  # scripts. helm is pinned to the version the tests are written with; python3, yq and shellcheck are on the runner.
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm 4.3.0
        run: |
          set -euo pipefail
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm-v4.3.0-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64 helm-v4.3.0-linux-amd64.tar.gz
          helm version --short
      - name: Chart tests
        run: test/chart.sh
      # The alert rules as the chart renders them, checked and unit-tested with promtool from its image.
      - name: Alert rule tests
        run: CONTAINER_ENGINE=docker test/alerts.sh
      - name: The tests left the tree as it was
        run: git status --porcelain && git diff --exit-code
  # test/prerequisites.sh: the script that makes the chart's five prerequisites from password-protected PEMs. It
  # makes its own throwaway CA and needs no cluster. Run on the two systems the script is used on: a Linux with
  # OpenSSL 3 and bash 5, and macOS with the LibreSSL and the bash 3.2 it ships.
  prerequisites:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, openssl: openssl, bash: bash}
          - {os: macos-latest, openssl: /usr/bin/openssl, bash: /bin/bash}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests
        env:
          OPENSSL: ${{ matrix.openssl }}
          BASH_UNDER_TEST: ${{ matrix.bash }}
        run: |
          "${BASH_UNDER_TEST}" test/prerequisites.sh
      - name: The tests left the tree as it was
        run: git status --porcelain && git diff --exit-code
  # Publishes the chart when its version is new: the package of this commit, as the release
  # mongodb-search-helm-<version>. A version that is already released is left alone. Only on main, and only after
  # the other jobs passed. To release: change `version` in chart/mongodb-search-helm/Chart.yaml and merge.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [chart, prerequisites, diagrams]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write             # to create the release; every other job reads only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm 4.3.0
        run: |
          set -euo pipefail
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm-v4.3.0-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64 helm-v4.3.0-linux-amd64.tar.gz
      - name: Publish the chart when its version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *//p' chart/mongodb-search-helm/Chart.yaml)"
          tag="mongodb-search-helm-${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} is already released: nothing to do"
            exit 0
          fi
          helm package chart/mongodb-search-helm
          gh release create "${tag}" "mongodb-search-helm-${version}.tgz" --target "${GITHUB_SHA}" \
            --title "mongodb-search-helm ${version}" --generate-notes
  # Every diagram page through diagram-kit's checks (a font that did not load, a label past its box, text under
  # 4.5:1 in either theme, a dashed arrow with no label, sideways scroll at 375 px). No PNG is written: the committed
  # ones are rendered and looked at by a person. The kit's tag is given twice; keep the two the same.
  diagrams:
    uses: ephico2real2/diagram-kit/.github/workflows/check-diagrams.yml@v0.2.4
    with:
      kit: v0.2.4
